<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="widgetWindow.title">Desktop Widget</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: transparent;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }

    .widget-container {
      position: absolute;
      background: rgba(37, 42, 61, 0.85);
      backdrop-filter: blur(15px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: all 0.3s;
    }

    .widget-container:hover {
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow: 0 12px 40px rgba(139, 92, 246, 0.2);
    }

    .widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px 16px 0 0;
      cursor: move;
      -webkit-app-region: drag;
    }

    .widget-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: white;
      font-size: 13px;
      font-weight: 600;
    }

    .widget-title svg {
      color: var(--widget-color, #8b5cf6);
    }

    .widget-actions {
      display: flex;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .widget-action-btn {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .widget-action-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }

    .widget-action-btn.close:hover {
      background: rgba(239, 68, 68, 0.8);
    }

    .widget-content {
      padding: 14px;
      color: white;
    }

    /* Clock Widget */
    .clock-widget {
      text-align: center;
    }

    .clock-time {
      font-size: 42px;
      font-weight: 700;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .clock-date {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 4px;
    }

    /* Weather Widget */
    .weather-widget {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .weather-icon {
      width: 48px;
      height: 48px;
      color: #fbbf24;
    }

    .weather-temp {
      font-size: 32px;
      font-weight: 700;
    }

    .weather-desc {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
    }

    .weather-details {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    /* Schedule Widget */
    .schedule-widget {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }

    .schedule-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      border-left: 3px solid var(--event-color, #8b5cf6);
    }

    .schedule-time {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      min-width: 50px;
    }

    .schedule-event {
      flex: 1;
      font-size: 13px;
    }

    /* Notes Widget */
    .notes-widget {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .note-item {
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      font-size: 13px;
      position: relative;
    }

    .note-item textarea {
      width: 100%;
      min-height: 60px;
      background: transparent;
      border: none;
      color: white;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
    }

    .note-item textarea:focus {
      outline: none;
    }

    /* Pomodoro Widget */
    .pomodoro-widget {
      text-align: center;
    }

    .pomodoro-timer {
      font-size: 48px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .pomodoro-status {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      margin: 8px 0;
    }

    .pomodoro-controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 12px;
    }

    .pomodoro-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pomodoro-btn.start {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }

    .pomodoro-btn.pause {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
    }

    .pomodoro-btn.reset {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .pomodoro-btn:hover {
      transform: scale(1.05);
    }

    /* Quick Tools Widget */
    .quick-tools-widget {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .quick-tool-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-tool-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--tool-color, #8b5cf6);
      transform: translateY(-2px);
    }

    .quick-tool-btn svg {
      color: var(--tool-color, #8b5cf6);
    }

    .quick-tool-btn span {
      font-size: 10px;
      text-align: center;
    }

    /* Chat AI Widget */
    .chat-ai-widget {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-messages {
      flex: 1;
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-message {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      max-width: 85%;
    }

    .chat-message.user {
      background: rgba(139, 92, 246, 0.3);
      align-self: flex-end;
    }

    .chat-message.ai {
      background: rgba(255, 255, 255, 0.1);
      align-self: flex-start;
    }

    .chat-input-wrapper {
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: white;
      font-size: 12px;
    }

    .chat-input:focus {
      outline: none;
      border-color: rgba(139, 92, 246, 0.5);
    }

    .chat-send-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chat-send-btn:hover {
      transform: scale(1.05);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Context Menu for Widgets */
    .widget-context-menu {
      position: fixed;
      z-index: 100000;
      min-width: 220px;
      background: rgba(37, 42, 61, 0.95);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 6px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      animation: widgetContextMenuFadeIn 0.15s ease;
    }

    @keyframes widgetContextMenuFadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .widget-context-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
      text-align: left;
    }

    .widget-context-menu-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .widget-context-menu-item.danger {
      color: #ef4444;
    }

    .widget-context-menu-item.danger:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    .widget-context-menu-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 6px 0;
    }

    .widget-context-menu-header {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 6px;
    }

    .widget-context-menu-header h4 {
      color: white;
      font-size: 13px;
      font-weight: 600;
      margin: 0;
    }

    .widget-context-menu-header p {
      color: rgba(255, 255, 255, 0.5);
      font-size: 11px;
      margin: 4px 0 0 0;
    }

    .widget-context-menu-slider {
      padding: 12px;
    }

    .widget-context-menu-slider label {
      display: block;
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .widget-context-menu-slider input[type="range"] {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
    }

    .widget-context-menu-slider input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #8b5cf6;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s;
    }

    .widget-context-menu-slider input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      background: #a78bfa;
    }

    .widget-color-picker {
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .widget-color-option {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }

    .widget-color-option:hover {
      transform: scale(1.2);
    }

    .widget-color-option.active {
      border-color: white;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }

    /* Widget Settings Panel */
    .widget-settings-panel {
      margin-top: 10px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      border: 1px solid rgba(139, 92, 246, 0.3);
      display: none;
      max-height: 280px;
      overflow-y: auto;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .widget-settings-panel.open {
      display: block;
      animation: settingsPanelSlideIn 0.2s ease;
    }

    @keyframes settingsPanelSlideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .widget-settings-panel::-webkit-scrollbar {
      width: 6px;
    }

    .widget-settings-panel::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
    }

    .widget-settings-panel::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.7);
      border-radius: 3px;
    }

    .widget-settings-panel::-webkit-scrollbar-thumb:hover {
      background: rgba(139, 92, 246, 1);
    }

    .widget-settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 12px;
    }

    .widget-settings-row:last-child {
      margin-bottom: 0;
    }

    .widget-settings-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      white-space: nowrap;
      font-weight: 500;
    }

    .widget-settings-control {
      flex: 1;
      min-width: 120px;
    }

    .widget-settings-control select,
    .widget-settings-control input[type="text"],
    .widget-settings-control input[type="number"] {
      width: 100%;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      color: white;
      font-size: 12px;
      transition: all 0.2s;
    }

    .widget-settings-control select:focus,
    .widget-settings-control input[type="text"]:focus,
    .widget-settings-control input[type="number"]:focus {
      outline: none;
      border-color: rgba(139, 92, 246, 0.8);
      background: rgba(255, 255, 255, 0.18);
    }

    .widget-settings-control input[type="color"] {
      width: 100%;
      height: 32px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      cursor: pointer;
      padding: 2px;
      background: rgba(255, 255, 255, 0.12);
    }

    .widget-settings-control input[type="range"] {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      -webkit-appearance: none;
    }

    .widget-settings-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: linear-gradient(135deg, #8b5cf6, #a78bfa);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(139, 92, 246, 0.5);
      transition: all 0.2s;
    }

    .widget-settings-control input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      box-shadow: 0 3px 10px rgba(139, 92, 246, 0.7);
    }

    .widget-settings-toggle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }

    .widget-settings-btn {
      width: 100%;
      padding: 8px 12px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(139, 92, 246, 0.2));
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 8px;
      color: white;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .widget-settings-btn:hover {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.5), rgba(139, 92, 246, 0.3));
      border-color: rgba(139, 92, 246, 0.7);
      transform: translateY(-1px);
    }

    .widget-settings-btn:active {
      transform: translateY(0);
    }

    /* Dropdown Settings Panel */
    .widget-dropdown-panel {
      position: absolute;
      top: 50px;
      right: 10px;
      width: 280px;
      background: rgba(30, 35, 50, 0.98);
      backdrop-filter: blur(20px);
      border-radius: 12px;
      border: 1px solid rgba(139, 92, 246, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      overflow: hidden;
      display: none;
      animation: dropdownFadeIn 0.2s ease;
    }

    .widget-dropdown-panel.open {
      display: block;
    }

    @keyframes dropdownFadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .widget-dropdown-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(139, 92, 246, 0.2);
      background: rgba(139, 92, 246, 0.1);
    }

    .widget-dropdown-title {
      font-size: 13px;
      font-weight: 600;
      color: white;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .widget-dropdown-close {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
    }

    .widget-dropdown-close:hover {
      background: rgba(239, 68, 68, 0.8);
    }

    .widget-dropdown-content {
      padding: 14px;
      max-height: 320px;
      overflow-y: auto;
    }

    .widget-dropdown-content::-webkit-scrollbar {
      width: 5px;
    }

    .widget-dropdown-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .widget-dropdown-content::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.6);
      border-radius: 3px;
    }

    .dropdown-section {
      margin-bottom: 16px;
    }

    .dropdown-section:last-child {
      margin-bottom: 0;
    }

    .dropdown-section-title {
      font-size: 10px;
      font-weight: 600;
      color: rgba(139, 92, 246, 0.9);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .dropdown-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 10px;
    }

    .dropdown-row:last-child {
      margin-bottom: 0;
    }

    .dropdown-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
      white-space: nowrap;
    }

    .dropdown-control {
      flex: 1;
      min-width: 100px;
    }

    .dropdown-control select,
    .dropdown-control input[type="text"],
    .dropdown-control input[type="number"] {
      width: 100%;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: white;
      font-size: 12px;
      transition: all 0.2s;
    }

    .dropdown-control select:focus,
    .dropdown-control input[type="text"]:focus,
    .dropdown-control input[type="number"]:focus {
      outline: none;
      border-color: rgba(139, 92, 246, 0.7);
      background: rgba(255, 255, 255, 0.12);
    }

    .dropdown-control input[type="color"] {
      width: 100%;
      height: 32px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      cursor: pointer;
      padding: 2px;
      background: rgba(255, 255, 255, 0.08);
    }

    .dropdown-control input[type="range"] {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      -webkit-appearance: none;
    }

    .dropdown-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: linear-gradient(135deg, #8b5cf6, #a78bfa);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(139, 92, 246, 0.5);
      transition: all 0.2s;
    }

    .dropdown-control input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      box-shadow: 0 3px 10px rgba(139, 92, 246, 0.7);
    }

    .dropdown-toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
    }

    .dropdown-color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .dropdown-color-option {
      width: 100%;
      aspect-ratio: 1;
      background-color: var(--color);
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }

    .dropdown-color-option:hover {
      transform: scale(1.1);
    }

    .dropdown-color-option.active {
      border-color: white;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>
  <div id="widgetContainer" class="widget-container">
    <div class="widget-header">
      <div class="widget-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span id="widgetTitle">Widget</span>
      </div>
      <div class="widget-actions">
        <button class="widget-action-btn" onclick="console.log('Settings clicked'); window.toggleSettingsDropdown && window.toggleSettingsDropdown();" title="Settings" data-i18n-title="widgetWindow.settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m4.22-10.22l4.24-4.24M6.34 17.66l-4.24 4.24M23 12h-6m-6 0H1m20.24 4.24l-4.24-4.24M6.34 6.34L2.1 2.1"/>
          </svg>
        </button>
        <button class="widget-action-btn" onclick="refreshWidget()" title="Refresh" data-i18n-title="widgetWindow.refresh">

    function tWidget(key, vars = {}, fallback) {
      const raw = window.i18n ? window.i18n.t(key) : key;

    // Toggle settings panel functions

    // Clock functions
    function updateClock() {
      const now = new Date();
      const locale = savedLang === 'ru' ? 'ru-RU' : 'en-US';
      const timeStr = now.toLocaleTimeString(locale, { hour12: false });
      const dateStr = now.toLocaleDateString(locale, { weekday: 'long', month: 'long', day: 'numeric' });
      
      const timeEl = document.getElementById('clockTime');
      const dateEl = document.getElementById('clockDate');
      
      if (timeEl) timeEl.textContent = timeStr;
      if (dateEl) dateEl.textContent = dateStr;
    }

    // Pomodoro functions
    let pomodoroInterval = null;
    let pomodoroTime = 25 * 60;
    let pomodoroRunning = false;

    function togglePomodoro() {
      const btn = document.querySelector('.pomodoro-btn.start');
      const status = document.getElementById('pomodoroStatus');
      
      if (pomodoroRunning) {
        clearInterval(pomodoroInterval);
        pomodoroRunning = false;
        btn.textContent = tWidget('widgetWindow.pomodoro.start');
        btn.classList.remove('pause');
        status.textContent = tWidget('widgetWindow.pomodoro.paused');
      } else {
        pomodoroRunning = true;
        btn.textContent = tWidget('widgetWindow.pomodoro.pause');
        btn.classList.add('pause');
        status.textContent = tWidget('widgetWindow.pomodoro.focusing');
        
        pomodoroInterval = setInterval(() => {
          pomodoroTime--;
          
          const minutes = Math.floor(pomodoroTime / 60);
          const seconds = pomodoroTime % 60;
          
          const timerEl = document.getElementById('pomodoroTimer');
          if (timerEl) {
            timerEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
          }
          
          if (pomodoroTime <= 0) {
            clearInterval(pomodoroInterval);
            pomodoroRunning = false;
            status.textContent = tWidget('widgetWindow.pomodoro.breakTime');
            btn.textContent = tWidget('widgetWindow.pomodoro.start');
            btn.classList.remove('pause');
          }
        }, 1000);
      }
    }

      clearInterval(pomodoroInterval);
      pomodoroRunning = false;
      pomodoroTime = 25 * 60;
      
      const timerEl = document.getElementById('pomodoroTimer');

      const btn = document.querySelector('.pomodoro-btn.start');

    // AI state
    let aiSessionId = 'chat-ai-' + widgetId;
    let aiProvider = 'openai';
    let isWaitingForAI = false;

    async function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const messages = document.getElementById('chatMessages');

      if (!input || !messages) return;

      const message = input.value.trim();
      if (!message) return;

      // Add user message
      const userMsg = document.createElement('div');
      userMsg.className = 'chat-message user';
      userMsg.textContent = message;
      messages.appendChild(userMsg);

      input.value = '';
      messages.scrollTop = messages.scrollHeight;

      // Show loading indicator
      isWaitingForAI = true;
      const loadingMsg = document.createElement('div');
      loadingMsg.className = 'chat-message ai';
      loadingMsg.innerHTML = `<em>${tWidget('widgetWindow.chat.thinking')}</em>`;
      loadingMsg.id = 'loadingMessage';
      messages.appendChild(loadingMsg);

      try {
        // Check if API key is set
        const keyStatus = await window.electronAPI.getAIApiKeyStatus(aiProvider);
        
        if (!keyStatus.hasKey) {
          // No API key - show demo response
          setTimeout(() => {
            const loadingEl = document.getElementById('loadingMessage');
            if (loadingEl) loadingEl.remove();
            
            const aiMsg = document.createElement('div');
            aiMsg.className = 'chat-message ai';
            aiMsg.innerHTML = `<strong>${tWidget('widgetWindow.chat.noKeyTitle')}</strong><br><br>` +
              `${tWidget('widgetWindow.chat.noKeyDesc')}`;
            messages.appendChild(aiMsg);
            messages.scrollTop = messages.scrollHeight;
            isWaitingForAI = false;
          }, 500);
          return;
        }

        // Send to AI API
        const result = await window.electronAPI.chatWithAI(aiProvider, message, aiSessionId);

        // Remove loading message
        const loadingEl = document.getElementById('loadingMessage');
        if (loadingEl) loadingEl.remove();

        if (result.success) {
          // Add AI response
          const aiMsg = document.createElement('div');
          aiMsg.className = 'chat-message ai';
          aiMsg.textContent = result.content;
          messages.appendChild(aiMsg);
        } else {
          // Show error
          const errorMsg = document.createElement('div');
          errorMsg.className = 'chat-message ai';
          errorMsg.style.color = '#fca5a5';
          errorMsg.textContent = tWidget('widgetWindow.chat.errorPrefix') + (result.error || tWidget('widgetWindow.chat.errorFallback'));
          messages.appendChild(errorMsg);
        }
      } catch (error) {
        // Remove loading message
        const loadingEl = document.getElementById('loadingMessage');
        if (loadingEl) loadingEl.remove();

        // Show error
        const errorMsg = document.createElement('div');
        errorMsg.className = 'chat-message ai';
        errorMsg.style.color = '#fca5a5';
        errorMsg.textContent = tWidget('widgetWindow.chat.errorPrefix') + error.message;
        messages.appendChild(errorMsg);
      }

      messages.scrollTop = messages.scrollHeight;
      isWaitingForAI = false;
    }

    // Apply global widget settings
    function applyGlobalSettings(settings) {
      const widgetContainer = document.getElementById('widgetContainer');
      const widgetContent = document.getElementById('widgetContent');
      if (!widgetContainer) return;

      console.log('Applying settings:', settings);

      // Transparency (0-100 -> 0.0-1.0)
      const transparency = (settings.transparency !== undefined ? settings.transparency : 85) / 100;
      // Изменяем alpha канал в background
      widgetContainer.style.background = `rgba(37, 42, 61, ${transparency})`;
      console.log('Setting transparency:', transparency, '(from settings:', settings.transparency, ')');

      // Blur effect
      if (settings.blurEffect === false) {
        widgetContainer.style.backdropFilter = 'none';
      } else {
        widgetContainer.style.backdropFilter = 'blur(15px)';
      }

      // Animation
      if (settings.animationEnabled === false) {
        widgetContainer.style.transition = 'none';
        if (widgetContent) widgetContent.style.transition = 'none';
      } else {
        widgetContainer.style.transition = 'all 0.3s';
        if (widgetContent) widgetContent.style.transition = 'all 0.3s';
      }

      // Scale - изменяем размеры контейнера и шрифты
      if (settings.scale !== undefined) {
        const scale = settings.scale / 100;
        
        // Новые размеры
        const newWidth = Math.round(baseWidth * scale);
        const newHeight = Math.round(baseHeight * scale);
        
        console.log('Scaling to:', newWidth, 'x', newHeight, '(scale:', scale, ')');
        
        // Применяем новые размеры к окну
        window.electronAPI.updateWidgetSize && window.electronAPI.updateWidgetSize(newWidth, newHeight);
        
        // Масштабируем шрифты внутри виджета
        if (widgetContent) {
          widgetContent.style.fontSize = `${14 * scale}px`;
          
          // Масштабируем заголовки
          const titleEl = widgetContainer.querySelector('.widget-title');
          if (titleEl) {
            titleEl.style.fontSize = `${13 * scale}px`;
          }
          
          // Масштабируем специфичные элементы
          const clockTime = document.getElementById('clockTime');
          if (clockTime) clockTime.style.fontSize = `${42 * scale}px`;
          
          const clockDate = document.getElementById('clockDate');
          if (clockDate) clockDate.style.fontSize = `${14 * scale}px`;
          
          const weatherTemp = document.querySelector('.weather-temp');
          if (weatherTemp) weatherTemp.style.fontSize = `${32 * scale}px`;
          
          const pomodoroTimer = document.getElementById('pomodoroTimer');
          if (pomodoroTimer) pomodoroTimer.style.fontSize = `${48 * scale}px`;
        }
      }
    }

    // Load and apply global settings on startup
    async function initWidgetSettings() {
      if (window.electronAPI) {
        try {
          const settings = await window.electronAPI.getGlobalWidgetSettings();
          
          // Сначала применяем прозрачность сразу
          if (settings.transparency !== undefined) {
            const transparency = settings.transparency / 100;
            const widgetContainer = document.getElementById('widgetContainer');
            if (widgetContainer) {
              widgetContainer.style.background = `rgba(37, 42, 61, ${transparency})`;
            }
          }
          
          // Затем применяем все остальные настройки
          applyGlobalSettings(settings);
        } catch (error) {
          console.error('Error loading widget settings:', error);
        }
      }
    }

    // Listen for global settings changes
    if (window.electronAPI) {
      window.electronAPI.onGlobalSettingsChanged((settings) => {
        applyGlobalSettings(settings);
      });

      // Listen for language changes
      window.electronAPI.onLanguageChanged((lang) => {
        console.log('Widget language changed to:', lang);
        // Для виджетов можно обновить заголовок если нужно
        const widgetTitle = document.getElementById('widgetTitle');
        if (widgetTitle) {
          // Перевод названий виджетов
          const titles = {
            clock: { en: 'Clock', ru: 'Часы' },
            weather: { en: 'Weather', ru: 'Погода' },
            schedule: { en: 'Schedule', ru: 'Расписание' },
            notes: { en: 'iNotes', ru: 'iЗаметки' },
            pomodoro: { en: 'iPomodoro', ru: 'iПомодоро' },
            quickTools: { en: 'Quick Tools', ru: 'Инструменты' },
            chatAI: { en: 'Chat AI', ru: 'Chat AI' }
          };
          const type = new URLSearchParams(window.location.search).get('type');
          if (type && titles[type]) {
            widgetTitle.textContent = titles[type][lang] || titles[type].en;
          }
        }
      });
    }

    // Initialize settings
    initWidgetSettings();

    // Make draggable
    const widgetContainer = document.getElementById('widgetContainer');
    const widgetHeader = document.querySelector('.widget-header');
    
    let isDragging = false;
    let startX, startY, initialX, initialY;
    
    widgetHeader.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      
      const rect = widgetContainer.getBoundingClientRect();
      initialX = rect.left;
      initialY = rect.top;
      
      e.preventDefault();
    });
    
    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      
      widgetContainer.style.left = `${initialX + dx}px`;
      widgetContainer.style.top = `${initialY + dy}px`;
      widgetContainer.style.right = 'auto';
      widgetContainer.style.bottom = 'auto';
    });
    
    document.addEventListener('mouseup', () => {
      isDragging = false;
    });
  </script>
</body>
</html>
