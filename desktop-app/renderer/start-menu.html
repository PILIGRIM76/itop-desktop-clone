<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>Start Menu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: rgba(32, 32, 32, 0.95);
      color: #fff;
      overflow: hidden;
      user-select: none;
      backdrop-filter: blur(20px);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .start-menu {
      width: 600px;
      height: 580px;
      display: flex;
      flex-direction: column;
    }

    /* Поиск */
    .search-container {
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 8px 16px;
      gap: 10px;
    }

    .search-box svg {
      width: 18px;
      height: 18px;
      opacity: 0.6;
    }

    .search-box input {
      flex: 1;
      background: none;
      border: none;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .search-box input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    /* Основной контент */
    .menu-content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Левая панель - приложения */
    .apps-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Закреплённые */
    .pinned-section {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 12px;
    }

    .pinned-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
    }

    .pinned-app {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 4px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .pinned-app:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .pinned-app .app-icon {
      width: 32px;
      height: 32px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    .pinned-app .app-icon svg {
      width: 20px;
      height: 20px;
    }

    .pinned-app .app-name {
      font-size: 11px;
      text-align: center;
      max-width: 64px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Все приложения */
    .all-apps-section {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .all-apps-section::-webkit-scrollbar {
      width: 6px;
    }

    .all-apps-section::-webkit-scrollbar-track {
      background: transparent;
    }

    .all-apps-section::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .letter-group {
      padding: 4px 16px;
    }

    .letter-header {
      font-size: 13px;
      font-weight: 600;
      color: #0078d4;
      padding: 4px 0;
    }

    .app-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      gap: 12px;
      transition: background 0.15s;
    }

    .app-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .app-item .app-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      flex-shrink: 0;
    }

    .app-item .app-icon svg {
      width: 16px;
      height: 16px;
    }

    .app-item .app-info {
      flex: 1;
      min-width: 0;
    }

    .app-item .app-name {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-item .app-category {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
    }

    .app-item .pin-btn {
      opacity: 0;
      padding: 4px;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
    }

    .app-item:hover .pin-btn {
      opacity: 1;
    }

    .app-item .pin-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .app-item .pin-btn svg {
      width: 14px;
      height: 14px;
      opacity: 0.6;
    }

    .app-item .pin-btn.pinned svg {
      opacity: 1;
      fill: currentColor;
    }

    /* Правая панель */
    .right-panel {
      width: 200px;
      background: rgba(0, 0, 0, 0.2);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
    }

    .user-section {
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user-avatar svg {
      width: 24px;
      height: 24px;
      opacity: 0.7;
    }

    .user-name {
      font-size: 13px;
      font-weight: 500;
    }

    .quick-links {
      padding: 8px 0;
      flex: 1;
    }

    .quick-link {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      gap: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .quick-link:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .quick-link svg {
      width: 18px;
      height: 18px;
      opacity: 0.7;
    }

    .quick-link span {
      font-size: 13px;
    }

    /* Нижняя панель */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.3);
    }

    .power-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .power-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .power-btn svg {
      width: 18px;
      height: 18px;
    }

    .power-menu {
      display: none;
      position: absolute;
      bottom: 50px;
      left: 16px;
      background: rgba(40, 40, 40, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 4px;
      min-width: 160px;
      backdrop-filter: blur(20px);
    }

    .power-menu.show {
      display: block;
    }

    .power-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }

    .power-menu-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .power-menu-item svg {
      width: 16px;
      height: 16px;
      opacity: 0.7;
    }

    /* Анимация */
    .start-menu {
      animation: slideUp 0.2s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Результаты поиска */
    .search-results {
      display: none;
    }

    .search-results.show {
      display: block;
    }

    .search-results .pinned-section,
    .search-results .all-apps-section {
      display: none;
    }
  </style>
</head>
<body>
  <div class="start-menu">
    <!-- Поиск -->
    <div class="search-container">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="M21 21l-4.35-4.35"></path>
        </svg>
        <input type="text" id="searchInput" placeholder="Введите для поиска приложений..." autocomplete="off">
      </div>
    </div>

    <!-- Основной контент -->
    <div class="menu-content">
      <!-- Левая панель -->
      <div class="apps-panel">
        <!-- Закреплённые -->
        <div class="pinned-section">
          <div class="section-title">Закреплённые</div>
          <div class="pinned-grid" id="pinnedApps">
            <!-- Динамически -->
          </div>
        </div>

        <!-- Все приложения -->
        <div class="all-apps-section" id="allApps">
          <!-- Динамически -->
        </div>
      </div>

      <!-- Правая панель -->
      <div class="right-panel">
        <div class="user-section">
          <div class="user-avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <div class="user-name" id="userName">Пользователь</div>
        </div>

        <div class="quick-links">
          <div class="quick-link" data-action="documents">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <span>Документы</span>
          </div>
          <div class="quick-link" data-action="pictures">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span>Изображения</span>
          </div>
          <div class="quick-link" data-action="downloads">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>Загрузки</span>
          </div>
          <div class="quick-link" data-action="music">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 18V5l12-2v13"></path>
              <circle cx="6" cy="18" r="3"></circle>
              <circle cx="18" cy="16" r="3"></circle>
            </svg>
            <span>Музыка</span>
          </div>
          <div class="quick-link" data-action="videos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="23 7 16 12 23 17 23 7"></polygon>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
            <span>Видео</span>
          </div>
          <div class="quick-link" data-action="settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span>Настройки</span>
          </div>
          <div class="quick-link" data-action="filemanager">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>Проводник</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Нижняя панель -->
    <div class="bottom-bar">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span style="font-size: 13px;">iTop Easy Desktop</span>
      </div>

      <div class="power-btn" id="powerBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
          <line x1="12" y1="2" x2="12" y2="12"></line>
        </svg>
        <span>Питание</span>

        <div class="power-menu" id="powerMenu">
          <div class="power-menu-item" data-action="sleep">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <span>Спящий режим</span>
          </div>
          <div class="power-menu-item" data-action="shutdown">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>Завершение работы</span>
          </div>
          <div class="power-menu-item" data-action="restart">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            <span>Перезагрузка</span>
          </div>
          <div class="power-menu-item" data-action="lock">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>Блокировка</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="start-menu.js"></script>
</body>
</html>
